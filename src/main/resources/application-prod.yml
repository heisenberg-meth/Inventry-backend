spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    repair-on-migrate: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}

app:
  jwt:
    secret: ${JWT_SECRET}
  security:
    allowed-origins: ${ALLOWED_ORIGINS}
  rate-limit:
    enabled: true
    auth-rpm: ${RATE_LIMIT_AUTH_RPM:20}
    public-rpm: ${RATE_LIMIT_PUBLIC_RPM:50}
    authenticated-rpm: ${RATE_LIMIT_AUTHENTICATED_RPM:200}
    tenant-rpm: ${RATE_LIMIT_TENANT_RPM:1000}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

logging:
  level:
    root: INFO
    "[com.ims]": INFO
    "[org.springframework.web]": INFO
    "[org.hibernate.SQL]": ERROR

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false