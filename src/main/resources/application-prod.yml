server:
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 3
      minimum-idle: 1
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: ${REDIS_HOST:}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        temp:
          use_jdbc_metadata_defaults: false

  flyway:
    enabled: true
    repair-on-migrate: true
    validate-on-migrate: false
    baseline-on-migrate: true

  main:
    lazy-initialization: true
    banner-mode: off

  cache:
    type: none

management:
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      enabled: true
    info:
      enabled: true
    prometheus:
      enabled: true

app:
  kafka:
    enabled: false

  redis:
    enabled: false

  jwt:
    secret: ${JWT_SECRET}

  security:
    allowed-origins: ${ALLOWED_ORIGINS:*}

  rate-limit:
    enabled: false
    auth-rpm: ${RATE_LIMIT_AUTH_RPM:20}
    public-rpm: ${RATE_LIMIT_PUBLIC_RPM:50}
    authenticated-rpm: ${RATE_LIMIT_AUTHENTICATED_RPM:200}
    tenant-rpm: ${RATE_LIMIT_TENANT_RPM:1000}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

logging:
  level:
    root: INFO
    org.springframework: WARN
    org.hibernate: WARN
    com.zaxxer.hikari: WARN
    com.ims: INFO

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false