spring:
  profiles:
    active: ${activatedProperties:local}
  web:
    resources:
      add-mappings: false
  datasource:
    url: jdbc:postgresql://postgres:5432/inventry
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    hibernate:
      ddl-auto: validate
      properties:
        hibernate:
          multiTenancy: DISCRIMINATOR
          tenant_identifier_resolver: com.ims.config.HibernateTenantResolver
          format_sql: true
          use_sql_comments: true
    show-sql: false
  cache:
    type: redis
    redis:
      time-to-live: 3600s
      cache-null-values: false
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
      timeout: 2000ms

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
        ims: true
  prometheus:
    metrics:
      export:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:1kA2LI4GBW8Goua0gdEsWSyAT4OH+npD172GmO8lisg=}  # Base64-encoded 256-bit key
    expiry-seconds: 86400
    refresh-expiry-seconds: 604800

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId},%X{spanId}]"
  zipkin:
    base-url: http://zipkin:9411
    enabled: false
