spring:
  threads:
    virtual:
      enabled: true
  application:
    name: ims-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  web:
    resources:
      add-mappings: false

  datasource:
    url: jdbc:postgresql://postgres:5432/inventry
    username: ${DB_USERNAME:ims_user}
    password: ${DB_PASSWORD:changeme}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
      properties:
        hibernate:
          multiTenancy: DISCRIMINATOR
          tenant_identifier_resolver: com.ims.config.HibernateTenantResolver
          format_sql: true
          use_sql_comments: true
    show-sql: false
  cache:
    type: redis
    redis:
      time-to-live: 3600s
      cache-null-values: false
  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      repositories:
        enabled: false
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: ims-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
        ims: true
  prometheus:
    metrics:
      export:
        enabled: true

app:
  jwt:
    secret: ${JWT_SECRET:ZGV2LW9ubHktc2VjcmV0LWNoYW5nZS1tZS1pbi1wcm9kLW1pbi0zMi1jaGFycyEh}
    expiry-seconds: 86400
    refresh-expiry-seconds: 604800
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    auth-rpm: ${RATE_LIMIT_AUTH_RPM:20}
    public-rpm: ${RATE_LIMIT_PUBLIC_RPM:50}
    authenticated-rpm: ${RATE_LIMIT_AUTHENTICATED_RPM:200}
    tenant-rpm: ${RATE_LIMIT_TENANT_RPM:1000}
    window-seconds: ${RATE_LIMIT_WINDOW_SECONDS:60}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{traceId},%X{spanId}]"
  zipkin:
    base-url: http://zipkin:9411
    enabled: false
