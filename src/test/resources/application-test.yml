spring:
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    properties:
      hibernate:
        multiTenancy: NONE
  cache:
    type: none
  flyway:
    enabled: true
  data:
    redis:
      host: localhost
      port: 6379

app:
  jwt:
    secret: [REDACTED_JWT_SECRET]
    expiry-seconds: 86400
    refresh-expiry-seconds: 604800
  cache:
    product-ttl-minutes: 15
    stock-ttl-minutes: 5
    report-ttl-minutes: 30
    tenant-ttl-hours: 1
  rate-limit:
    public-rpm: 100
    authenticated-rpm: 500

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
