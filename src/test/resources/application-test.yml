management:
  health:
    defaults:
      enabled: false
    redis:
      enabled: false
    kafka:
      enabled: false
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,metrics,prometheus,info

spring:
  kafka:
    enabled: false
  datasource:
    url: jdbc:postgresql://localhost:5433/ims_db
    username: ims_user
    password: changeme
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    validate-on-migrate: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  data:
    redis:
      repositories:
        enabled: true
      password: changeme
  main:
    allow-bean-definition-overriding: true

app:
  outbox:
    enabled: false
  jwt:
    secret: "1kA2LI4GBW8Goua0gdEsWSyAT4OH+npD172GmO8lisg="
    expiry-seconds: 86400
    refresh-expiry-seconds: 604800
  security:
    allowed-origins: '*'
  rate-limit:
    enabled: false
    auth-rpm: 20
    public-rpm: 50
    authenticated-rpm: 200
    tenant-rpm: 1000
    window-seconds: 60

resilience4j:
  circuitbreaker:
    instances:
      redisService:
        registerHealthIndicator: false
        slidingWindowSize: 100
        failureRateThreshold: 100
        waitDurationInOpenState: 360000000
        permittedNumberOfCallsInHalfOpenState: 100
        slowCallDurationThreshold: 10000
        slowCallRateThreshold: 100
