spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/ims_db
    username: ims_user
    password: changeme
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.cache.RedisCacheAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  data:
    redis:
      repositories:
        enabled: false
  main:
    allow-bean-definition-overriding: true

app:
  jwt:
    secret: "1kA2LI4GBW8Goua0gdEsWSyAT4OH+npD172GmO8lisg="
    expiry-seconds: 86400
    refresh-expiry-seconds: 604800
  security:
    allowed-origins: '*'
  rate-limit:
    auth-rpm: 20
    public-rpm: 50
    authenticated-rpm: 200
    window-seconds: 60
