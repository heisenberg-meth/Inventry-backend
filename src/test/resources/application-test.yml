spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/ims_db
    username: ims_user
    password: changeme
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    repair-on-migrate: true
    validate-on-migrate: false
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.autoconfigure.kafka.KafkaAutoConfiguration
  data:
    redis:
      repositories:
        enabled: false
      password: changeme
  main:
    allow-bean-definition-overriding: true

app:
  outbox:
    enabled: false
  jwt:
    secret: "1kA2LI4GBW8Goua0gdEsWSyAT4OH+npD172GmO8lisg="
    expiry-seconds: 86400
    refresh-expiry-seconds: 604800
  security:
    allowed-origins: '*'
  rate-limit:
    enabled: false
    auth-rpm: 10000
    public-rpm: 10000
    authenticated-rpm: 10000
    tenant-rpm: 10000
    window-seconds: 60
