spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
  web:
    resources:
      add-mappings: false
  datasource:
    url: jdbc:h2:mem:testdb
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  cache:
    type: none
  flyway:
    enabled: false
  data:
    redis:
      repositories:
        enabled: false

app:
  jwt:
    secret: "1kA2LI4GBW8Goua0gdEsWSyAT4OH+npD172GmO8lisg="
    expiry-seconds: 86400
    refresh-expiry-seconds: 604800
  security:
    allowed-origins: '*'
  rate-limit:
    auth-rpm: 20
    public-rpm: 50
    authenticated-rpm: 200
    window-seconds: 60

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info