apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: ims-postgres
spec:
  serviceName: "ims-postgres"
  replicas: 1
  selector:
    matchLabels:
      app: ims-postgres
  template:
    metadata:
      labels:
        app: ims-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "ims_db"
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: ims-db-secret
                  key: username
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: ims-db-secret
                  key: password
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
            claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: ims-postgres
spec:
  selector:
    app: ims-postgres
  ports:
    - port: 5432
      targetPort: 5432
  type: ClusterIP
