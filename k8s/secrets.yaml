apiVersion: v1
kind: Secret
metadata:
  name: ims-db-secret
type: Opaque
stringData:
  url: "jdbc:postgresql://ims-postgres:5432/ims_db"
  username: "ims_user"
  password: "CHANGE_ME_DB_PASSWORD"
---
apiVersion: v1
kind: Secret
metadata:
  name: ims-app-secret
type: Opaque
stringData:
  jwt-secret: "CHANGE_ME_JWT_SECRET"
  grafana-admin-password: "CHANGE_ME_GRAFANA_PASSWORD"
