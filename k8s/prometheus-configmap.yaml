apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: 'ims-backend'
        metrics_path: '/actuator/prometheus'
        static_configs:
          - targets: ['ims-backend-service:80']
