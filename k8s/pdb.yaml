apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ims-backend-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ims-backend
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ims-postgres-pdb
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: ims-postgres
