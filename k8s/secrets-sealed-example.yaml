# This is an example of how to use Sealed Secrets for proper secrets management
# Install sealed-secrets: kubectl apply -f https://github.com/bitnami-lab/sealed-secrets/releases/download/v0.24.5/controller.yaml
# Then encrypt your secrets: kubeseal --format yaml < secrets.yaml > sealed-secrets.yaml

apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ims-db-secret-sealed
  namespace: default
spec:
  encryptedData:
    url: <ENCRYPTED_VALUE>
    username: <ENCRYPTED_VALUE>
    password: <ENCRYPTED_VALUE>
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: ims-app-secret-sealed
  namespace: default
spec:
  encryptedData:
    jwt-secret: <ENCRYPTED_VALUE>
    grafana-admin-password: <ENCRYPTED_VALUE>
