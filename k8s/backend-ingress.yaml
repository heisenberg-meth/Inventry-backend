apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ims-ingress
  namespace: ims-namespace
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
  - hosts:
    - api.ims-inventory.com
    secretName: ims-tls-cert
  rules:
  - host: api.ims-inventory.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: ims-service
            port:
              number: 80
