apiVersion: v1
kind: ConfigMap
metadata:
  name: ims-app-config
data:
  application-prod.yml: |
    spring:
      datasource:
        hikari:
          maximum-pool-size: 20
          minimum-idle: 5
          connection-timeout: 30000
          idle-timeout: 600000
          max-lifetime: 1800000
          leak-detection-threshold: 60000
      jpa:
        hibernate:
          ddl-auto: validate
        properties:
          hibernate:
            multiTenancy: DISCRIMINATOR
            tenant_identifier: 1
      cache:
        type: redis
      flyway:
        enabled: true
    app:
      cache:
        product-ttl-minutes: 15
        stock-ttl-minutes: 5
        report-ttl-minutes: 30
        tenant-ttl-hours: 1
      security:
        allowed-origins: "https://ims.yourdomain.com"
    management:
      endpoints:
        web:
          exposure:
            include: health,info,metrics,prometheus
      endpoint:
        health:
          show-details: always
          group:
            readiness:
              include: db,redis,ping
            liveness:
              include: ping
      metrics:
        export:
          prometheus:
            enabled: true
      tracing:
        sampling:
          probability: 1.0
      zipkin:
        endpoint: http://zipkin:9411/api/v2/spans
    logging:
      pattern:
        console: '{"timestamp":"%d{ISO8601}","level":"%p","thread":"%t","logger":"%c","message":"%m","traceId":"%X{traceId:-}","spanId":"%X{spanId:-}"}%n'
      logstash:
        host: logstash:5000
    resilience4j:
      circuitbreaker:
        instances:
          backend:
            sliding-window-size: 10
            failure-rate-threshold: 50
            wait-duration-in-open-state: 10000
            permitted-number-of-calls-in-half-open-state: 5
      retry:
        instances:
          backend:
            max-attempts: 3
            wait-duration: 1000
            exponential-backoff-multiplier: 2
      timelimiter:
        instances:
          backend:
            timeout-duration: 5000

