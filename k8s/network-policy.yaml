apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: inventry-backend-netpol
  namespace: inventry
spec:
  podSelector:
    matchLabels:
      app: inventry-backend
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: inventry-ops
    ports:
    - protocol: TCP
      port: 8080
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432
  - to:
    - podSelector:
        matchLabels:
          app: redis
    ports:
    - protocol: TCP
      port: 6379
  - to:
    - podSelector:
        matchLabels:
          app: kafka
    ports:
    - protocol: TCP
      port: 9092
