apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: inventry-business-rules
  namespace: inventry
  labels:
    app: prometheus
    role: alert-rules
spec:
  groups:
  - name: infra-alerts
    rules:
    - alert: HighCpuUsage
      expr: rate(container_cpu_usage_seconds_total{pod=~"inventry-backend.*", container!=""}[5m]) > 0.8
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High CPU usage on {{ $labels.pod }}"
        description: "CPU usage above 80% for 5 minutes"
    - alert: HighMemoryUsage
      expr: (container_memory_usage_bytes{pod=~"inventry-backend.*", container!=""} / container_spec_memory_limit_bytes{pod=~"inventry-backend.*", container!=""}) > 0.9
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High memory usage on {{ $labels.pod }}"
        description: "Memory usage above 90% for 5 minutes"
  - name: business-alerts
    rules:
    - alert: HighCategoryCreationFailureRate
      expr: rate(ims_category_create_error[5m]) > 0.5
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "High failure rate in category creation"
        description: "Category creation is failing at a high rate (> 0.5/s), which may indicate database or service issues."
    - alert: AuthFailureSpike
      expr: sum(rate(http_server_requests_seconds_count{status="403", uri!~"/actuator/.*"}[5m])) > 10
      for: 2m
      labels:
        severity: critical
      annotations:
        summary: "Spike in 403 Forbidden errors"
        description: "Auth failures detected across non-actuator endpoints, possible brute force or misconfigured RBAC"
    - alert: CategoryServiceErrorRate
      expr: sum(rate(ims_category_create_error[5m])) / sum(rate(ims_category_create_total[5m])) > 0.1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: "High category service error rate"
        description: "Error rate for category operations is above 10%"
